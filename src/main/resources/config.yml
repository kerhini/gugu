# JukeboxBoat Configuration

# Радиус воспроизведения музыки (в блоках)
sound-radius: 64

# Показывать партиклы нот при воспроизведении
particle-effects: true

# Продолжать воспроизведение при движении лодки
allow-moving-playback: true

# Интервал обновления звука при движении (в тиках, 20 тиков = 1 секунда)
sound-update-interval: 60

# Сообщения
messages:
  disc-inserted: "&aДиск вставлен! Музыка играет ♪"
  disc-ejected: "&eДиск извлечён."
  no-disc: "&cВ лодке нет диска."
  not-a-disc: "&cЭтот предмет не является музыкальным диском!"
  boat-converted: "&aЛодка конвертирована в проигрыватель!"
  no-permission: "&cУ вас нет разрешения на это действие."
